# ==========================================
# JPA / Hibernate \u8A2D\u5B9A (DB\u64CD\u4F5C\u3092\u81EA\u52D5\u5316\u3059\u308B\u6A5F\u80FD)
# ==========================================
# \u30C7\u30FC\u30BF\u30D9\u30FC\u30B9\u306E\u300C\u65B9\u8A00\uFF08Dialect\uFF09\u300D\u3092\u6307\u5B9A\u3002
# \u3053\u308C\u3092\u8A2D\u5B9A\u3059\u308B\u3053\u3068\u3067\u3001Spring Boot\u304CPostgreSQL\u5C02\u7528\u306E\u6B63\u3057\u3044SQL\u3092\u558B\u308C\u308B\u3088\u3046\u306B\u306A\u308A\u307E\u3059\u3002
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# \u30A2\u30D7\u30EA\u8D77\u52D5\u6642\u306E\u30C6\u30FC\u30D6\u30EB\u81EA\u52D5\u751F\u6210\u306E\u30EB\u30FC\u30EB\u3002
# "update" \u306B\u3057\u3066\u304A\u304F\u3068\u3001Java\u306EEntity\u30AF\u30E9\u30B9\u306B\u5408\u308F\u305B\u3066\u30C6\u30FC\u30D6\u30EB\u3092\u81EA\u52D5\u3067\u4F5C\u6210\u30FB\u66F4\u65B0\u3057\u3066\u304F\u308C\u307E\u3059\u3002
spring.jpa.hibernate.ddl-auto=update


# ==========================================
# \u30ED\u30B0\u51FA\u529B\u8A2D\u5B9A (\u958B\u767A\u30FB\u30C7\u30D0\u30C3\u30B0\u7528)
# ==========================================
# Spring Boot\u304C\u88CF\u5074\u3067\u5B9F\u884C\u3057\u305FSQL\u6587\u3092\u30B3\u30F3\u30BD\u30FC\u30EB\uFF08\u753B\u9762\u4E0B\uFF09\u306B\u8868\u793A\u3059\u308B\u8A2D\u5B9A\u3002
spring.jpa.show-sql=true

# \u51FA\u529B\u3055\u308C\u308BSQL\u6587\u3092\u3001\u4EBA\u9593\u304C\u8AAD\u307F\u3084\u3059\u3044\u3088\u3046\u306B\u6539\u884C\u30FB\u30A4\u30F3\u30C7\u30F3\u30C8\u3057\u3066\u7DBA\u9E97\u306B\u30D5\u30A9\u30FC\u30DE\u30C3\u30C8\u3059\u308B\u3002
spring.jpa.properties.hibernate.format_sql=true